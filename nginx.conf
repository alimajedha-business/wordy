server {
    listen 80;
    server_name _;

    root /var/www/wordy/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # SPA routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets generated by Vite (safe for 1 year immutable cache)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Root icons & static assets without Vite content hash (must revalidate)
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
    }

    # Service Worker & PWA manifest must never be cached aggressively
    location ~* (sw\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
